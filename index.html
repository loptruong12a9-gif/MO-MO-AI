<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mỡ Mỡ AI</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mỡ Mỡ">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen overflow-hidden">
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold flex items-center gap-2">🐾 <span id="app-title">Mỡ Mỡ AI</span></h1>
        <button onclick="toggleSettings()" class="text-sm bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg transition">Cài đặt Key</button>
    </header>
    <div id="settings-modal" class="hidden bg-gray-800 border-b border-gray-700 p-4 transition-all">
        <div class="max-w-xl mx-auto flex gap-2">
            <input type="password" id="api-key-input" placeholder="Nhập Google Gemini API Key (AIza...)" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-medium transition">Lưu</button>
        </div>
    </div>
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-pink-600 flex items-center justify-center font-bold text-sm shrink-0">M</div>
            <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 max-w-[85%] text-sm leading-relaxed shadow">
                Dạ, Mỡ Mỡ đã bật chế độ tự động thông minh (Gemini 3.5 Flash và dự phòng đa tầng) rồi ạ! 🐾 Anh cứ nhắn thoải mái không lo lỗi nhé.
            </div>
        </div>
    </div>
    <div class="bg-gray-800 border-t border-gray-700 p-3">
        <div class="max-w-3xl mx-auto flex gap-2">
            <textarea id="user-input" rows="1" placeholder="Nhắn gì đó cho Mỡ Mỡ..." class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 resize-none max-h-32" onkeydown="handleKeyDown(event)"></textarea>
            <button onclick="sendMessage()" class="bg-pink-600 hover:bg-pink-500 px-5 rounded-xl font-medium transition flex items-center justify-center">Gửi</button>
        </div>
    </div>
    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const apiKeyInput = document.getElementById('api-key-input');
        const settingsModal = document.getElementById('settings-modal');
        let chatHistory = [];

        // Danh sách các model ưu tiên từ cao cấp xuống dự phòng để không bao giờ bị nghẽn
        const GEMINI_MODELS = [
            "gemini-3.5-flash",
            "gemini-2.5-flash",
            "gemini-1.5-flash"
        ];

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) apiKeyInput.value = savedKey;
        };

        function toggleSettings() { settingsModal.classList.toggle('hidden'); }
        
        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('Đã lưu API Key cho Mỡ Mỡ thành công!');
                toggleSettings();
            } else { alert('Vui lòng nhập API Key hợp lệ.'); }
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) { alert('Vui lòng bấm vào "Cài đặt Key" và nhập Google Gemini API Key trước nhé!'); toggleSettings(); return; }
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            
            chatHistory.push({ role: "user", parts: [{ text: text }] });
            const aiMessageDiv = appendMessage("Mỡ Mỡ đang suy nghĩ...", 'ai', true);

            let success = false;
            let lastErrorMsg = "";

            // Vòng lặp thử qua các model dự phòng tự động
            for (const model of GEMINI_MODELS) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: chatHistory })
                    });

                    const data = await response.json();
                    
                    if (!data.error && data.candidates && data.candidates.length > 0) {
                        const reply = data.candidates[0].content.parts[0].text;
                        aiMessageDiv.innerHTML = marked.parse(reply);
                        chatHistory.push({ role: "model", parts: [{ text: reply }] });
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                        success = true;
                        break; // Thoát vòng lặp khi gọi thành công
                    } else if (data.error) {
                        lastErrorMsg = data.error.message;
                    }
                } catch (error) {
                    lastErrorMsg = error.message;
                }
            }

            // Nếu tất cả các model đều gặp sự cố (ví dụ hết hạn mức Key)
            if (!success) {
                aiMessageDiv.innerHTML = `<span class="text-red-400">Lỗi: ${lastErrorMsg}. (Gợi ý: Hãy tạo một API Key mới miễn phí tại Google AI Studio và cập nhật vào mục Cài đặt Key).</span>`;
                // Xóa tin nhắn lỗi khỏi lịch sử chat để không ảnh hưởng các lượt sau
                chatHistory.pop();
            }
        }

        function appendMessage(text, sender, isLoading = false) {
            const isUser = sender === 'user';
            const div = document.createElement('div');
            div.className = `flex items-start gap-3 ${isUser ? 'flex-row-reverse' : ''}`;
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full ${isUser ? 'bg-emerald-600' : 'bg-pink-600'} flex items-center justify-center font-bold text-sm shrink-0">${isUser ? 'anh' : 'M'}</div>
                <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 max-w-[85%] text-sm leading-relaxed shadow ${isLoading ? 'italic text-gray-400' : ''}">
                    ${isUser ? escapeHtml(text) : marked.parse(text)}
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div.querySelector('.max-w-\\[85\\%\\]');
        }

        function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    </script>
</body>
</html>
