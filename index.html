<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mỡ Mỡ AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Tinh chỉnh scrollbar gọn gàng kiểu ChatGPT */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#212121] text-gray-100 flex flex-col h-screen overflow-hidden font-sans">

    <!-- Header tối giản phong cách ChatGPT -->
    <header class="h-14 border-b border-gray-800 flex justify-between items-center px-4 bg-[#212121] shrink-0">
        <h1 class="text-base font-semibold text-gray-200 flex items-center gap-2">
            <span>🐾</span> Mỡ Mỡ AI
        </h1>
        <button onclick="openSettings()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg transition border border-gray-700">
            Cài đặt API Key
        </button>
    </header>

    <!-- Modal nhập Key gọn nhẹ, ẩn hiện mượt mà -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
        <div class="bg-[#2f2f2f] border border-gray-700 rounded-2xl p-5 max-w-md w-full shadow-2xl flex flex-col gap-4">
            <h3 class="text-sm font-semibold text-gray-200">Cấu hình Google Gemini API Key</h3>
            <input type="password" id="api-key-input" placeholder="Dán API Key vào đây (AIza...)" class="w-full bg-[#1e1e1e] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-gray-500">
            <div class="flex justify-end gap-2 mt-1">
                <button onclick="closeSettings()" class="px-4 py-2 text-xs rounded-xl bg-gray-700 hover:bg-gray-600 transition">Hủy</button>
                <button onclick="saveApiKey()" class="px-4 py-2 text-xs rounded-xl bg-white text-black font-medium hover:bg-gray-200 transition">Lưu lại</button>
            </div>
        </div>
    </div>

    <!-- Khung chat chính -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-3xl w-full mx-auto">
        <div class="flex items-start gap-4">
            <div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-xs shrink-0 text-white">M</div>
            <div class="text-sm leading-relaxed text-gray-200 pt-1 space-y-2">
                Dạ, em chào anh! Khung chat đã được thu gọn chuẩn phong cách ChatGPT. Anh bấm vào nút <b>Cài đặt API Key</b> góc trên bên phải để nhập key là có thể nhắn tin mượt mà ngay ạ! 🐾
            </div>
        </div>
    </div>

    <!-- Khung nhập tin nhắn phía dưới -->
    <div class="p-4 bg-gradient-to-t from-[#212121] via-[#212121] to-transparent shrink-0">
        <div class="max-w-3xl mx-auto relative bg-[#2f2f2f] border border-gray-700/80 rounded-2xl shadow-lg flex items-end p-3">
            <textarea id="user-input" rows="1" placeholder="Nhắn tin cho Mỡ Mỡ..." class="flex-1 bg-transparent text-sm text-gray-100 focus:outline-none resize-none max-h-32 pr-2 leading-relaxed" onkeydown="handleKeyDown(event)"></textarea>
            <button onclick="sendMessage()" class="bg-white text-black hover:bg-gray-200 w-8 h-8 rounded-xl font-medium transition flex items-center justify-center shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.933.75.75 0 0 0 0-1.284A60.517 60.517 0 0 0 3.478 2.404Z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const apiKeyInput = document.getElementById('api-key-input');
        const settingsModal = document.getElementById('settings-modal');
        let chatHistory = [];

        // Định danh chuẩn ổn định cao cấp hiện tại của Google
        const MODEL_NAME = 'gemini-3.8-flash';

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            } else {
                openSettings();
            }
        };

        function openSettings() { settingsModal.classList.remove('hidden'); }
        function closeSettings() { settingsModal.classList.add('hidden'); }
        
        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                closeSettings();
            } else {
                alert('Vui lòng nhập API Key hợp lệ.');
            }
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) { 
                event.preventDefault(); 
                sendMessage(); 
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key');
            
            if (!apiKey) { 
                openSettings(); 
                return; 
            }
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            
            chatHistory.push({ role: "user", parts: [{ text: text }] });
            const aiMessageDiv = appendMessage("Đang suy nghĩ...", 'ai', true);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });

                const data = await response.json();
                
                if (!data.error && data.candidates && data.candidates.length > 0) {
                    const reply = data.candidates[0].content.parts[0].text;
                    aiMessageDiv.innerHTML = marked.parse(reply);
                    chatHistory.push({ role: "model", parts: [{ text: reply }] });
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } else {
                    throw new Error(data.error ? data.error.message : "Phản hồi không hợp lệ từ API.");
                }
            } catch (error) {
                aiMessageDiv.innerHTML = `<span class="text-red-400">Lỗi kết nối: ${error.message}</span>`;
                chatHistory.pop();
            }
        }

        function appendMessage(text, sender, isLoading = false) {
            const isUser = sender === 'user';
            const div = document.createElement('div');
            div.className = `flex items-start gap-4 ${isUser ? 'justify-end' : ''}`;
            
            if (isUser) {
                div.innerHTML = `
                    <div class="bg-[#2f2f2f] text-gray-100 rounded-2xl px-4 py-3 max-w-[80%] text-sm leading-relaxed shadow-sm">
                        ${escapeHtml(text)}
                    </div>
                    <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs shrink-0 text-white">A</div>
                `;
            } else {
                div.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-xs shrink-0 text-white">M</div>
                    <div class="text-sm leading-relaxed text-gray-200 pt-1 space-y-2 max-w-[85%] ${isLoading ? 'text-gray-400 italic' : ''}">
                        ${isLoading ? text : marked.parse(text)}
                    </div>
                `;
            }
            
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div.querySelector('.text-sm');
        }

        function escapeHtml(text) { 
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
        }
    </script>
</body>
</html>
