<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tân AI - Trợ lý cá nhân</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tân AI">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen overflow-hidden">
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold flex items-center gap-2">🤖 <span id="app-title">Tân AI</span></h1>
        <button onclick="toggleSettings()" class="text-sm bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg transition">Cài đặt Key</button>
    </header>
    <div id="settings-modal" class="hidden bg-gray-800 border-b border-gray-700 p-4 transition-all">
        <div class="max-w-xl mx-auto flex gap-2">
            <input type="password" id="api-key-input" placeholder="Nhập OpenAI API Key (sk-...)" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-medium transition">Lưu</button>
        </div>
    </div>
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm shrink-0">AI</div>
            <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 max-w-[85%] text-sm leading-relaxed shadow">
                Xin chào! Tôi là trợ lý AI của anh. Hãy nhập OpenAI API Key ở phần "Cài đặt Key" phía trên để bắt đầu trò chuyện nhé.
            </div>
        </div>
    </div>
    <div class="bg-gray-800 border-t border-gray-700 p-3">
        <div class="max-w-3xl mx-auto flex gap-2">
            <textarea id="user-input" rows="1" placeholder="Nhập tin nhắn..." class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 resize-none max-h-32" onkeydown="handleKeyDown(event)"></textarea>
            <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 px-5 rounded-xl font-medium transition flex items-center justify-center">Gửi</button>
        </div>
    </div>
    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const apiKeyInput = document.getElementById('api-key-input');
        const settingsModal = document.getElementById('settings-modal');
        let messages = [{ role: "system", content: "You are a helpful assistant." }];
        window.onload = () => {
            const savedKey = localStorage.getItem('openai_api_key');
            if (savedKey) apiKeyInput.value = savedKey;
        };
        function toggleSettings() { settingsModal.classList.toggle('hidden'); }
        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('openai_api_key', key);
                alert('Đã lưu API Key thành công!');
                toggleSettings();
            } else { alert('Vui lòng nhập API Key hợp lệ.'); }
        }
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }
        }
        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = localStorage.getItem('openai_api_key');
            if (!apiKey) { alert('Vui lòng bấm vào "Cài đặt Key" và nhập OpenAI API Key trước!'); toggleSettings(); return; }
            if (!text) return;
            appendMessage(text, 'user');
            userInput.value = '';
            messages.push({ role: "user", content: text });
            const aiMessageDiv = appendMessage("Đang suy nghĩ...", 'ai', true);
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: 'gpt-4o-mini', messages: messages })
                });
                const data = await response.json();
                if (data.error) { aiMessageDiv.innerHTML = `<span class="text-red-400">Lỗi: ${data.error.message}</span>`; return; }
                const reply = data.choices[0].message.content;
                aiMessageDiv.innerHTML = marked.parse(reply);
                messages.push({ role: "assistant", content: reply });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (error) { aiMessageDiv.innerHTML = `<span class="text-red-400">Lỗi kết nối mạng: ${error.message}</span>`; }
        }
        function appendMessage(text, sender, isLoading = false) {
            const isUser = sender === 'user';
            const div = document.createElement('div');
            div.className = `flex items-start gap-3 ${isUser ? 'flex-row-reverse' : ''}`;
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full ${isUser ? 'bg-emerald-600' : 'bg-blue-600'} flex items-center justify-center font-bold text-sm shrink-0">${isUser ? 'anh' : 'AI'}</div>
                <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 max-w-[85%] text-sm leading-relaxed shadow ${isLoading ? 'italic text-gray-400' : ''}">
                    ${isUser ? escapeHtml(text) : marked.parse(text)}
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div.querySelector('.max-w-\\[85\\%\\]');
        }
        function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    </script>
</body>
</html>
